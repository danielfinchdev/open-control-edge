name: Feedback
description: Share a bug or an idea about Open Control Edge
title: "[Feedback]: "
labels: [feedback]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Bug
        - Idea
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Comment
      description: Don't include tokens or personal data.
    validations:
      required: true
