name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Native dependencies stay beside the executable, avoiding extraction to a user-writable temp folder.
      - name: Publish
        run: dotnet publish src/OpenControlEdge/OpenControlEdge.csproj -c Release -r win-x64 -o dist

      - name: Package application folder
        run: Compress-Archive -Path dist\* -DestinationPath OpenControlEdge-win-x64.zip

      - name: Upload OpenControlEdge bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenControlEdge-win-x64.zip
          path: OpenControlEdge-win-x64.zip
          if-no-files-found: error
