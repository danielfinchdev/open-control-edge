name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # SelfContained, PublishSingleFile and DebugType=none come from the Release csproj.
      - name: Publish
        run: dotnet publish src/EdgeWidget/EdgeWidget.csproj -c Release -r win-x64 -o dist

      - name: Upload EdgeWidget.exe
        uses: actions/upload-artifact@v4
        with:
          name: EdgeWidget.exe
          path: dist/EdgeWidget.exe
          if-no-files-found: error
