name: Build

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Native dependencies stay beside the executable, avoiding extraction to a user-writable temp folder.
      - name: Publish
        run: dotnet publish src/OpenControlEdge/OpenControlEdge.csproj -c Release -r win-x64 -o dist

      - name: Package application folder
        run: Compress-Archive -Path dist\* -DestinationPath OpenControlEdge-win-x64.zip

      - name: Upload OpenControlEdge bundle
        uses: actions/upload-artifact@v4
        with:
          name: OpenControlEdge-win-x64.zip
          path: OpenControlEdge-win-x64.zip
          if-no-files-found: error
