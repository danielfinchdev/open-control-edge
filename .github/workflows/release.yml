name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  # SignPath downloads the unsigned artifact of this run.
  actions: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Same publish as README / build.yml. Release csproj keeps DebugType=none. The executable installs itself
      # (welcome window), so the folder carries no script.
      # The tag must be the csproj version: SignPath only signs an executable whose product version is that value.
      - name: Check version
        id: version
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          [xml]$project = Get-Content src/OpenControlEdge/OpenControlEdge.csproj
          $declared = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($declared -ne $version) { throw "La etiqueta v$version no coincide con <Version>$declared</Version> del csproj." }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish src/OpenControlEdge/OpenControlEdge.csproj -c Release -r win-x64 -o dist

      # Code signing with SignPath Foundation (free for open source). Runs only when the secret SIGNPATH_API_TOKEN and
      # the variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG exist;
      # otherwise the release goes out unsigned with a warning. See README, "Firma".
      - name: Check code signing configuration
        id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if ($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID -and $env:SIGNPATH_PROJECT_SLUG -and $env:SIGNPATH_SIGNING_POLICY_SLUG) {
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Output "::warning title=Firma de código::SignPath no está configurado (falta el secreto SIGNPATH_API_TOKEN o alguna variable SIGNPATH_*). Se publica sin firmar."
          }

      - name: Upload unsigned application for signing
        id: unsigned
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenControlEdge-unsigned
          path: dist/
          if-no-files-found: error

      # The SignPath artifact configuration signs OpenControlEdge.exe inside this artifact (Authenticode).
      - name: Sign with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.version.outputs.value }}"

      - name: Use the signed application
        if: steps.signing.outputs.enabled == 'true'
        run: |
          $signature = Get-AuthenticodeSignature signed/OpenControlEdge.exe
          if ($signature.Status -ne 'Valid') { throw "La firma de OpenControlEdge.exe no es válida: $($signature.Status)" }
          Copy-Item signed/* dist/ -Recurse -Force

      - name: Package application folder
        run: Compress-Archive -Path dist\* -DestinationPath OpenControlEdge-win-x64.zip

      # In-app updates: the archive is signed with the project's own ECDSA P-256 key (secret UPDATE_SIGNING_KEY, a PKCS#8
      # PEM); the app only installs an archive whose OpenControlEdge-win-x64.zip.sig matches its built-in public key.
      - name: Sign archive for in-app updates
        id: updatesig
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) {
            "file=" >> $env:GITHUB_OUTPUT
            Write-Output "::warning title=Actualizaciones::Falta el secreto UPDATE_SIGNING_KEY: la Release no llevará firma para las actualizaciones desde la app."
            exit 0
          }
          $key = [System.Security.Cryptography.ECDsa]::Create()
          $key.ImportFromPem($env:UPDATE_SIGNING_KEY)
          $bytes = [System.IO.File]::ReadAllBytes("OpenControlEdge-win-x64.zip")
          $signature = $key.SignData($bytes, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.DSASignatureFormat]::IeeeP1363FixedFieldConcatenation)
          if (-not $key.VerifyData($bytes, $signature, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.DSASignatureFormat]::IeeeP1363FixedFieldConcatenation)) { throw "La firma recién hecha no se verifica." }
          [System.IO.File]::WriteAllText("OpenControlEdge-win-x64.zip.sig", [Convert]::ToBase64String($signature))
          "file=OpenControlEdge-win-x64.zip.sig" >> $env:GITHUB_OUTPUT

      - name: Attest OpenControlEdge.exe
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/OpenControlEdge.exe

      - name: Attach application bundle to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "Open Control Edge $($tag.Substring(1))"
          $files = @("OpenControlEdge-win-x64.zip")
          if ("${{ steps.updatesig.outputs.file }}") { $files += "${{ steps.updatesig.outputs.file }}" }
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            $notes = "[Code signing policy](https://github.com/$env:GITHUB_REPOSITORY#code-signing-policy): free code signing provided by SignPath.io, certificate by SignPath Foundation."
            gh release create $tag @files --title $title --notes $notes --generate-notes --latest
          }
