name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Same publish as README / build.yml. Release csproj keeps DebugType=none.
      - name: Publish
        run: dotnet publish src/EdgeWidget/EdgeWidget.csproj -c Release -r win-x64 -o dist

      - name: Attest EdgeWidget.exe
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/EdgeWidget.exe

      - name: Attach EdgeWidget.exe to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "EdgeWidget $($tag.Substring(1))"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/EdgeWidget.exe --clobber
          } else {
            gh release create $tag dist/EdgeWidget.exe --title $title --generate-notes
          }
